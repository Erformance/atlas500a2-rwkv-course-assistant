<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>课程助手 · Atlas 500 A2</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --text:#1d1f23; --muted:#8a8f98; --border:#e4e6ea;
  --user:#2f6feb; --user-text:#fff; --ai:#fff; --code-bg:#f2f3f5; --accent:#2f6feb;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171a; --panel:#1d2024; --text:#e8eaed; --muted:#9aa0a6; --border:#2c3136;
    --user:#3b82f6; --user-text:#fff; --ai:#23272c; --code-bg:#141619; --accent:#60a5fa;
  }
}
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);z-index:5}
.title{font-weight:600;font-size:16px}
.badge{font-size:12px;color:var(--muted);margin-left:8px}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#c1c5cb;flex:none}
.dot.on{background:#22c55e}
.dot.off{background:#ef4444}
main{flex:1;overflow-y:auto;padding:18px 16px 8px;overscroll-behavior:contain}
.wrap{max-width:760px;margin:0 auto}
.msg{display:flex;margin-bottom:14px}
.msg.user{justify-content:flex-end}
.stack{display:flex;flex-direction:column;align-items:flex-start;max-width:82%;min-width:0}
.msg.user .stack{align-items:flex-end}
.bubble{max-width:100%;padding:10px 14px;border-radius:14px;line-height:1.65;font-size:15px;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.user .bubble{background:var(--user);color:var(--user-text);border-bottom-right-radius:4px}
.ai .bubble{background:var(--ai);border:1px solid var(--border);border-bottom-left-radius:4px}
.status-line{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.cursor::after{content:"\258B";margin-left:2px;color:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
pre{position:relative;background:var(--code-bg);border:1px solid var(--border);border-radius:10px;
  padding:28px 12px 10px;overflow-x:auto;margin:10px 0}
pre code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px}
.copy{position:absolute;top:6px;right:6px;font-size:12px;padding:2px 8px;cursor:pointer;
  border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--muted)}
.hint{color:var(--muted);font-size:13px;text-align:center;margin-top:26px;line-height:2}
footer{background:var(--panel);border-top:1px solid var(--border);padding:10px 16px 14px}
.input-row{max-width:760px;margin:0 auto}
textarea{width:100%;min-height:52px;max-height:180px;resize:none;font-size:16px;line-height:1.5;
  padding:10px 12px;border:1px solid var(--border);border-radius:12px;
  background:var(--bg);color:var(--text);font-family:inherit}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.actions{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
button{font-size:14px;padding:8px 16px;border-radius:10px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:transparent;color:var(--muted);border-color:var(--border)}
select{font-size:13px;padding:7px 8px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text)}
.spacer{flex:1}
.tip{font-size:12px;color:var(--muted)}
@media (max-width:460px){ .stack{max-width:92%} .badge{display:none} }
</style>
</head>
<body>
<header>
  <div><span class="title">课程助手</span><span class="badge">Atlas 500 A2 · 昇腾 310B · RWKV-7 2.9B · NPU 本地推理</span></div>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">连接中…</span></div>
</header>

<main id="scroller">
  <div class="wrap" id="msgs">
    <div class="hint" id="hint">问点课程相关的问题试试，比如「什么是人工智能？」<br>回答由这台设备上的 NPU 实时生成，不联网</div>
  </div>
</main>

<footer>
  <div class="input-row">
    <textarea id="q" placeholder="输入问题…（Enter 发送，Shift+Enter 换行）"></textarea>
    <div class="actions">
      <select id="len" title="最多生成多少 token">
        <option value="64">64 token</option>
        <option value="128" selected>128 token</option>
        <option value="192">192 token</option>
        <option value="256">256 token</option>
        <option value="512">512 token</option>
      </select>
      <button id="send">发送</button>
      <button id="new" class="ghost">新对话</button>
      <span class="spacer"></span>
      <span class="tip">生成期间请稍等，约 5.5 token/s</span>
    </div>
  </div>
</footer>

<script>
const scroller = document.getElementById('scroller');
const msgs = document.getElementById('msgs');
const qEl = document.getElementById('q');
const sendBtn = document.getElementById('send');
const newBtn = document.getElementById('new');
const lenEl = document.getElementById('len');
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
let hint = document.getElementById('hint');
let busy = false;
let es = null;
const ROLE_PREFIX = /^\s*(?:课程助手|助手|AI助手|Assistant)\s*[：:]\s*/;
function clean(t){ return t.replace(ROLE_PREFIX, ''); }

function nearBottom(){ return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80; }
function scrollDown(force){ if (force || nearBottom()) scroller.scrollTop = scroller.scrollHeight; }
function hideHint(){ if (hint){ hint.remove(); hint = null; } }

function addBubble(role){
  hideHint();
  const row = document.createElement('div');
  row.className = 'msg ' + role;
  const stack = document.createElement('div');
  stack.className = 'stack';
  const b = document.createElement('div');
  b.className = 'bubble';
  stack.appendChild(b);
  row.appendChild(stack);
  msgs.appendChild(row);
  scrollDown(true);
  return {row: row, stack: stack, bubble: b};
}

function setBusy(v){
  busy = v;
  sendBtn.disabled = v;
  sendBtn.textContent = v ? '生成中…' : '发送';
}

function ask(){
  const text = qEl.value.trim();
  if (!text || busy) return;
  addBubble('user').bubble.textContent = text;
  qEl.value = '';
  qEl.style.height = 'auto';

  const node = addBubble('ai');
  node.bubble.classList.add('cursor');
  let raw = '';
  // 立刻给个反馈：预填充要 3~5 秒，先显示“正在思考”+计时；一旦有内容或本轮结束就自动停
  node.bubble.textContent = '正在思考…';
  const startedAt = Date.now();
  const ticker = setInterval(function () {
    if (raw || !busy) { clearInterval(ticker); return; }
    node.bubble.textContent = '正在思考… 已等待 '
      + Math.round((Date.now() - startedAt) / 1000) + ' 秒';
  }, 1000);
  setBusy(true);

  es = new EventSource('/chat/stream?tokens=' + encodeURIComponent(lenEl.value)
                       + '&q=' + encodeURIComponent(text));
  es.onmessage = function (ev){
    let d;
    try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.delta){
      raw += d.delta;
      node.bubble.textContent = clean(raw);
      scrollDown(false);
    }
    if (d.error){
      node.bubble.classList.remove('cursor');
      node.bubble.textContent = clean(raw) + (raw ? '\n\n' : '') + '[出错] ' + d.error;
      es.close(); es = null; setBusy(false);
    }
    if (d.done){
      es.close(); es = null;
      node.bubble.classList.remove('cursor');
      renderAnswer(node.bubble, d.answer === undefined ? raw : d.answer);
      const st = document.createElement('div');
      st.className = 'status-line';
      st.textContent = '预填充 ' + d.prefill_s + 's ｜ ' + d.n + ' token ｜ '
        + d.tok_s.toFixed(2) + ' tok/s ｜ 停止 ' + d.stop + ' ｜ 第 ' + d.turn + ' 轮';
      node.stack.appendChild(st);
      setBusy(false);
      scrollDown(false);
      qEl.focus();
    }
  };
  es.onerror = function (){
    if (!es) return;                       // done 里已主动关闭，不算错误
    es.close(); es = null;
    node.bubble.classList.remove('cursor');
    node.bubble.textContent = clean(raw) + (raw ? '\n\n' : '') + '[连接中断，请重试]';
    setBusy(false);
  };
}

/* 把 ``` 围栏拆成代码块（不引入 markdown 库） */
function renderAnswer(bubble, raw){
  bubble.textContent = '';
  const parts = clean(raw).split('```');
  parts.forEach(function (part, i){
    if (i % 2 === 1){
      let code = part.replace(/^\n/, '');
      const nl = code.indexOf('\n');
      if (nl !== -1 && /^[A-Za-z0-9+#._-]{1,12}$/.test(code.slice(0, nl).trim())){
        code = code.slice(nl + 1);        // 去掉语言标记那一行
      }
      code = code.replace(/\n$/, '');
      const pre = document.createElement('pre');
      const c = document.createElement('code');
      c.textContent = code;
      pre.appendChild(c);
      const btn = document.createElement('button');
      btn.className = 'copy';
      btn.textContent = '复制';
      btn.onclick = function (){ copyText(code, btn); };
      pre.appendChild(btn);
      bubble.appendChild(pre);
    } else {
      const t = part.replace(/^\n+|\n+$/g, '');
      if (t) bubble.appendChild(document.createTextNode(t + '\n'));
    }
  });
}

function copyText(text, btn){
  const ok = function (){
    btn.textContent = '已复制';
    setTimeout(function (){ btn.textContent = '复制'; }, 1500);
  };
  const bad = function (){
    // 复制失败时退而求其次：把代码选中，提示手动复制
    const code = btn.parentElement && btn.parentElement.querySelector('code');
    if (code && window.getSelection){
      const range = document.createRange();
      range.selectNodeContents(code);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    btn.textContent = '请手动复制';
    setTimeout(function (){ btn.textContent = '复制'; }, 2500);
  };
  // http 页面不是安全上下文，navigator.clipboard 不可用，回退到 execCommand
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(ok, function (){ fallbackCopy(text, ok, bad); });
  } else {
    fallbackCopy(text, ok, bad);
  }
}

function fallbackCopy(text, ok, bad){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '-1000px';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  let copied = false;
  try { copied = document.execCommand('copy'); } catch (e) { copied = false; }
  document.body.removeChild(ta);
  if (copied) ok(); else bad();
}

async function newChat(){
  if (busy) return;
  try {
    await fetch('/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
                          body: JSON.stringify({reset: true})});
  } catch (e) {}
  msgs.innerHTML = '';
  hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = '已开始新对话，可以继续提问。';
  msgs.appendChild(hint);
  qEl.focus();
}

async function health(){
  try {
    const r = await fetch('/health', {cache: 'no-store'});
    const d = await r.json();
    dot.className = 'dot on';
    let txt = '在线';
    if (d.requests){
      txt += ' · 已答 ' + d.requests + ' 问';
      if (d.gen_s > 0) txt += ' · ' + (d.tokens / d.gen_s).toFixed(2) + ' tok/s';
    }
    statusText.textContent = txt;
  } catch (e) {
    dot.className = 'dot off';
    statusText.textContent = '连接中断';
  }
}

sendBtn.onclick = ask;
newBtn.onclick = newChat;
qEl.addEventListener('keydown', function (e){
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    ask();
  }
});
qEl.addEventListener('input', function (){
  qEl.style.height = 'auto';
  qEl.style.height = Math.min(qEl.scrollHeight, 180) + 'px';
});
setInterval(health, 30000);
health();
qEl.focus();
</script>
</body>
</html>
